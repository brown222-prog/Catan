<!doctype html><html><head><title>Island Settlers</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}body{margin:0;font:14px system-ui;background:#fafaf7}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&family=Lilita+One&display=swap">
<style>
/* Layout: board on the left, players and log on the right, your hand and actions under the board.
   Phones stack everything in one column. One committed look: bright ocean, paper panels, chunky buttons. */
:root {
  --ink: #12263a; --ink-2: #3d5670; --paper: #fffaf0; --paper-2: #f4ebd2; --line: #dccfae;
  --sea: #1b8fd0; --sea-deep: #0a4f86; --sea-dark: #073a63; --foam: #cfeeff;
  --sun: #ffc42e; --sun-deep: #d98f00; --ok: #1f9d55; --danger: #e0453a;
  --wood: #4ba35a; --brick: #dc6a43; --sheep: #acdc66; --wheat: #f6cd4c; --ore: #9fb0c6; --desert: #ecd9a6;
  --display: 'Lilita One', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --shadow: 0 3px 0 rgba(7, 40, 70, .28);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--body); font-size: 15px; color: var(--ink);
  background: var(--sea-deep);
  padding-inline: 0;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
svg { display: block; }
.ico { width: 1em; height: 1em; }

#app {
  height: 100%; display: grid; gap: 10px; padding: 10px 12px 12px;
  grid-template-columns: minmax(0, 1fr) 320px; grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top top" "stage side" "dock side";
  background:
    radial-gradient(1200px 700px at 30% 20%, #2aa6e6 0%, rgba(42, 166, 230, 0) 60%),
    linear-gradient(160deg, #0f6cae 0%, #0a4f86 55%, #073a63 100%);
}

/* ---------- top bar ---------- */
.top { grid-area: top; display: flex; align-items: center; gap: 14px; min-height: 46px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 26px; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .25); letter-spacing: .3px; }
.brand svg { width: 30px; height: 30px; }
.prompt {
  flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 10px; justify-content: center;
  background: var(--paper); border-radius: 999px; padding: 8px 18px; font-weight: 700; box-shadow: var(--shadow);
  min-height: 42px; text-align: center;
}
.prompt .dot { flex: none; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); }
.prompt.you { background: var(--sun); }
.top-right { display: flex; align-items: center; gap: 10px; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--paper); box-shadow: var(--shadow);
  display: grid; place-items: center;
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(7, 40, 70, .28); }

.dice { display: flex; gap: 8px; }
.die {
  width: 42px; height: 42px; border-radius: 10px; background: #fff; border: 2px solid var(--ink); box-shadow: var(--shadow);
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 5px; gap: 1px;
}
.die i { border-radius: 50%; background: transparent; }
.die i.on { background: var(--ink); }
.die.empty { opacity: .45; }
.die.tumble { animation: tumble .55s ease-out; }
@keyframes tumble { 0% { transform: rotate(-200deg) scale(.6); } 60% { transform: rotate(25deg) scale(1.15); } 100% { transform: none; } }
.dice-sum { align-self: center; font-family: var(--display); font-size: 24px; color: #fff; min-width: 28px; text-align: center; text-shadow: 0 2px 0 rgba(0, 0, 0, .25); }

/* ---------- board ---------- */
.stage { grid-area: stage; position: relative; min-height: 0; min-width: 0; }
#board { width: 100%; height: 100%; touch-action: manipulation; }
.frame { fill: #1a86c4; stroke: #f3e2b0; stroke-width: 14; stroke-linejoin: round; }
.frame-in { fill: url(#waves); stroke: none; }
.hex-fill { stroke: rgba(0, 0, 0, .28); stroke-width: 3; stroke-linejoin: round; }
.hex-hi { fill: none; stroke: rgba(255, 255, 255, .35); stroke-width: 3; }
.t-wood .hex-fill { fill: var(--wood); } .t-brick .hex-fill { fill: var(--brick); } .t-sheep .hex-fill { fill: var(--sheep); }
.t-wheat .hex-fill { fill: var(--wheat); } .t-ore .hex-fill { fill: var(--ore); } .t-desert .hex-fill { fill: var(--desert); }
.token { fill: #fff6dc; stroke: #8b6a2d; stroke-width: 3; }
.tnum { font: 800 27px var(--body); text-anchor: middle; fill: var(--ink); font-variant-numeric: tabular-nums; }
.tnum.hot6 { fill: #c1121f; }
.tpip { fill: var(--ink); } .tpip.hot6 { fill: #c1121f; }
.no-pips .tpip { display: none; }
.port-line { stroke: #f3e2b0; stroke-width: 7; stroke-linecap: round; }
.port-dot { fill: var(--paper); stroke: var(--sea-dark); stroke-width: 4; }
.pd-wood { fill: var(--wood); } .pd-brick { fill: var(--brick); } .pd-sheep { fill: var(--sheep); } .pd-wheat { fill: var(--wheat); } .pd-ore { fill: var(--ore); }
.port-t { font: 800 21px var(--body); text-anchor: middle; fill: var(--ink); }
.hotring { fill: none; stroke: #fff; stroke-width: 9; stroke-linejoin: round; pointer-events: none; animation: pulse 1s ease-in-out 3; }
@keyframes pulse { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
.road-o { stroke-linecap: round; fill: none; } .road-i { stroke-linecap: round; fill: none; }
.piece { stroke-width: 4; stroke-linejoin: round; }
.pop { animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); transform-box: fill-box; transform-origin: center; }
@keyframes pop { 0% { transform: scale(.2); opacity: 0; } 100% { transform: none; opacity: 1; } }
.hit { cursor: pointer; }
.hit.v { fill: rgba(255, 255, 255, .85); stroke: var(--sun); stroke-width: 6; animation: throb 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.hit.v:hover { fill: var(--sun); }
.hit.e { stroke: rgba(255, 255, 255, .85); stroke-width: 20; stroke-linecap: round; animation: fade 1s ease-in-out infinite; }
.hit.e:hover { stroke: var(--sun); }
.hit.h { fill: rgba(255, 255, 255, .18); stroke: #fff; stroke-width: 6; animation: fade 1s ease-in-out infinite; }
.hit.h:hover { fill: rgba(255, 196, 46, .5); }
@keyframes throb { 0%, 100% { transform: scale(.85); } 50% { transform: scale(1.15); } }
@keyframes fade { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
.robber { fill: #2b2f38; stroke: #0d0f14; stroke-width: 3; pointer-events: none; }

.toast {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--ink); color: #fff;
  padding: 9px 16px; border-radius: 999px; font-weight: 700; box-shadow: var(--shadow); max-width: 92%; text-align: center;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: 1; }
.toast.bad { background: var(--danger); }

/* ---------- dock: hand, dev cards, actions ---------- */
.dock { grid-area: dock; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: stretch; background: var(--paper); border-radius: 18px; padding: 10px 12px; box-shadow: var(--shadow); }
.hand { display: flex; gap: 8px; flex-wrap: wrap; }
.rcard {
  position: relative; width: 70px; height: 88px; border-radius: 12px; border: 3px solid rgba(0, 0, 0, .35); box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 0 4px; font-size: 38px; background: var(--paper-2);
}
.rcard b { font: 400 26px var(--display); line-height: 1; color: var(--ink); background: rgba(255, 255, 255, .85); border-radius: 8px; padding: 1px 9px; font-variant-numeric: tabular-nums; }
.rcard.zero { opacity: .5; }
.rcard .delta { position: absolute; top: -10px; right: -6px; font: 400 18px var(--display); color: #fff; background: var(--ok); border-radius: 999px; padding: 1px 8px; animation: rise 1.6s ease-out forwards; }
.rcard .delta.neg { background: var(--danger); }
@keyframes rise { 0% { transform: translateY(8px); opacity: 0; } 15% { transform: none; opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(-10px); opacity: 0; } }
.r-wood { background: var(--wood); } .r-brick { background: var(--brick); } .r-sheep { background: var(--sheep); }
.r-wheat { background: var(--wheat); } .r-ore { background: var(--ore); }

.devs { display: flex; gap: 8px; flex-wrap: wrap; align-content: flex-start; max-width: 380px; }
.dcard { display: flex; align-items: center; gap: 8px; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 5px 8px 5px 10px; font-weight: 700; font-size: 13px; }
.dcard .n { font: 400 17px var(--display); }
.dcard .new { font-size: 11px; color: var(--ink-2); font-weight: 600; }
.dcard button { border: 0; border-radius: 8px; padding: 4px 10px; background: var(--sun); font-weight: 800; font-size: 12px; box-shadow: 0 2px 0 var(--sun-deep); }
.dcard button:disabled { background: #e5e0d0; box-shadow: none; color: #8a8575; }
.devs .empty { color: var(--ink-2); font-size: 13px; align-self: center; }

.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; align-items: stretch; }
.btn {
  border: 0; border-radius: 12px; padding: 0 16px; min-height: 48px; font-weight: 800; font-size: 15px;
  background: #fff; border-bottom: 4px solid var(--line); box-shadow: 0 1px 0 rgba(0, 0, 0, .1); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn:disabled { opacity: .45; }
.btn.primary { background: var(--sun); border-bottom-color: var(--sun-deep); font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: .3px; }
.btn.go { background: var(--ok); color: #fff; border-bottom-color: #146b3a; font-family: var(--display); font-weight: 400; font-size: 18px; }
.btn.danger { background: var(--danger); color: #fff; border-bottom-color: #9d2a21; }
.btn.pulse { animation: glow 1.1s ease-in-out infinite; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 196, 46, .8); } 50% { box-shadow: 0 0 0 8px rgba(255, 196, 46, 0); } }
.bbtn { flex-direction: column; gap: 2px; padding: 5px 12px; min-width: 76px; font-size: 13px; }
.bbtn.on { background: var(--sun); border-bottom-color: var(--sun-deep); }
.bbtn .cost { display: flex; gap: 1px; font-size: 14px; }
.bbtn .left { font-size: 11px; font-weight: 600; color: var(--ink-2); }

/* ---------- side: players + log ---------- */
.side { grid-area: side; display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
.players { display: flex; flex-direction: column; gap: 8px; }
.pc { background: var(--paper); border-radius: 16px; padding: 9px 12px; border: 4px solid transparent; box-shadow: var(--shadow); display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; }
.pc.cur { border-color: var(--sun); }
.pc .sw { grid-row: span 2; width: 36px; height: 36px; border-radius: 50%; border: 3px solid; display: grid; place-items: center; font: 400 17px var(--display); }
.pc .nm { font-weight: 800; display: flex; gap: 6px; align-items: center; min-width: 0; }
.pc .chip { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; padding: 2px 6px; border-radius: 999px; background: var(--paper-2); color: var(--ink-2); }
.pc .vp { grid-row: span 2; font: 400 34px var(--display); line-height: 1; text-align: right; }
.pc .vp small { display: block; font: 700 10px var(--body); letter-spacing: .6px; color: var(--ink-2); text-transform: uppercase; }
.pc .st { display: flex; gap: 10px; font-size: 13px; color: var(--ink-2); font-weight: 700; font-variant-numeric: tabular-nums; flex-wrap: wrap; align-items: center; }
.pc .st span { display: inline-flex; gap: 4px; align-items: center; }
.pc .st svg { width: 15px; height: 15px; }
.badge { background: var(--sun); color: var(--ink); border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 800; }
.logbox { background: rgba(255, 250, 240, .92); border-radius: 16px; padding: 8px 12px; box-shadow: var(--shadow); min-height: 0; display: flex; flex-direction: column; flex: 1 1 0; }
.logbox summary { font-weight: 800; cursor: pointer; list-style: none; }
.logbox summary::-webkit-details-marker { display: none; }
#log { list-style: none; margin: 8px 0 0; padding: 0; overflow: auto; flex: 1 1 0; min-height: 90px; font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
#log li { display: flex; gap: 6px; align-items: baseline; line-height: 1.3; }
#log .d { flex: none; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink); margin-top: 3px; }
#log .gray { background: #bbb; }

/* ---------- modals ---------- */
.veil { position: fixed; inset: 0; background: rgba(5, 30, 55, .62); display: grid; place-items: center; padding: 16px; z-index: 20; overflow: auto; }
.veil[hidden] { display: none; }
.sheet { background: var(--paper); border-radius: 22px; width: min(560px, 100%); padding: 18px 20px 20px; box-shadow: 0 10px 0 rgba(0, 0, 0, .2); max-height: 100%; overflow: auto; }
.sheet h2 { margin: 0 0 4px; font: 400 28px var(--display); }
.sheet h3 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--ink-2); }
.sheet .sub { margin: 0 0 6px; color: var(--ink-2); font-weight: 600; }
.sheet header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.tiles { display: flex; gap: 8px; flex-wrap: wrap; }
.rtile {
  position: relative; width: 82px; height: 94px; border-radius: 14px; border: 3px solid rgba(0, 0, 0, .3); box-shadow: var(--shadow); font-size: 34px;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 0 5px;
}
button.rtile:disabled { opacity: .35; box-shadow: none; }
.rtile.sel { outline: 4px solid var(--ink); outline-offset: 2px; transform: translateY(-3px); }
.rtile .cnt { font: 400 21px var(--display); background: rgba(255, 255, 255, .9); border-radius: 8px; padding: 0 9px; line-height: 1.25; color: var(--ink); }
.rtile .rate { position: absolute; top: -9px; right: -7px; background: var(--ink); color: #fff; font: 800 11px var(--body); border-radius: 999px; padding: 2px 7px; }
.rtile .rate.good { background: var(--ok); }
.step { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.step .pm { display: flex; gap: 6px; }
.step .pm button { width: 38px; height: 34px; border-radius: 10px; border: 0; background: #fff; border-bottom: 3px solid var(--line); font: 800 20px var(--body); line-height: 1; }
.step .pm button:disabled { opacity: .35; }
.tabs { display: flex; gap: 6px; margin-top: 12px; background: var(--paper-2); padding: 4px; border-radius: 14px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 9px; border-radius: 10px; font-weight: 800; }
.tabs button.on { background: #fff; box-shadow: var(--shadow); }
.resp { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 2px dashed var(--line); font-weight: 700; flex-wrap: wrap; }
.resp:first-of-type { border-top: 0; }
.resp .who { display: flex; align-items: center; gap: 8px; flex: 1; }
.resp .st-y { color: var(--ok); } .resp .st-n { color: var(--danger); } .resp .st-w { color: var(--ink-2); }
.dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--ink); flex: none; }
.vlist { display: flex; flex-direction: column; gap: 8px; }
.vbtn { display: flex; align-items: center; gap: 12px; text-align: left; border: 0; border-bottom: 4px solid var(--line); background: #fff; border-radius: 14px; padding: 12px 14px; font-weight: 800; }
.vbtn small { margin-left: auto; color: var(--ink-2); font-weight: 700; }

.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 0; border-bottom: 3px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 14px; font-weight: 800; }
.seg button.on { background: var(--sun); border-bottom-color: var(--sun-deep); }
.seg button:disabled { opacity: .5; }
.swatches { display: flex; gap: 10px; }
.swatches button { width: 38px; height: 38px; border-radius: 50%; border: 4px solid transparent; box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px transparent; }
.swatches button.on { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--ink); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; font-weight: 700; border-top: 2px dashed var(--line); }
.toggle:first-of-type { border-top: 0; }
.toggle small { display: block; color: var(--ink-2); font-weight: 600; }
.sw-on { width: 52px; height: 30px; border-radius: 999px; border: 0; background: #c9c2ac; position: relative; flex: none; }
.sw-on::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; }
.sw-on[aria-pressed="true"] { background: var(--ok); }
.sw-on[aria-pressed="true"]::after { left: 25px; }
.sw-on:disabled { opacity: .5; }
.soon { margin-top: 14px; padding: 12px; border-radius: 14px; background: var(--paper-2); }
.soon h3 { margin-top: 0; }
.soon input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); font: inherit; background: #fff; margin-top: 6px; letter-spacing: 3px; text-transform: uppercase; }
.desc { margin: 6px 0 0; color: var(--ink-2); font-size: 13px; font-weight: 600; min-height: 2.6em; }
.hint { color: var(--ink-2); font-weight: 600; font-size: 13px; margin: 8px 0 0; }
.score { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.score div { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: #fff; font-weight: 800; }
.score div.win { background: var(--sun); }
.score b { margin-left: auto; font: 400 22px var(--display); }
.confetti { font-size: 46px; text-align: center; }

/* ---------- narrow screens ---------- */
@media (max-width: 999px) {
  #app { height: auto; min-height: 100%; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto auto; grid-template-areas: "top" "stage" "dock" "side"; }
  .stage { aspect-ratio: 1.12; }
  .actions { margin-left: 0; width: 100%; }
  .actions .btn { flex: 1 1 auto; }
  .players { display: grid; grid-template-columns: 1fr 1fr; }
  .brand { font-size: 22px; }
  .logbox { flex: none; }
  #log { max-height: 180px; flex: none; }
}
@media (max-width: 520px) {
  .players { grid-template-columns: 1fr; }
  .rcard { width: calc((100vw - 24px - 24px - 32px) / 5); min-width: 52px; height: 78px; font-size: 30px; }
  .rcard b { font-size: 21px; padding: 1px 6px; }
  .die { width: 36px; height: 36px; }
  .prompt { font-size: 14px; padding: 6px 12px; }
  .rtile { width: 70px; height: 86px; font-size: 30px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition: none !important; }
}

/* ---------- v2: +/- trading, tray, seafarers, rooms ---------- */
.rslot { display: flex; flex-direction: column; align-items: stretch; gap: 4px; }
.rcard.want { outline: 4px solid var(--ok); outline-offset: 1px; }
.rcard.give { outline: 4px solid var(--danger); outline-offset: 1px; }
.rcard .draft { position: absolute; top: -10px; left: -6px; font: 400 18px var(--display); color: #fff; border-radius: 999px; padding: 1px 8px; z-index: 1; }
.rcard .draft.up { background: var(--ok); } .rcard .draft.dn { background: var(--danger); }
.pm2 { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2px; }
.pbtn { border: 0; border-bottom: 3px solid rgba(0,0,0,.25); border-radius: 9px; min-height: 34px; min-width: 26px; font: 800 20px var(--body); line-height: 1; color: #fff; }
.pbtn.plus { background: var(--ok); justify-self: start; width: 30px; } .pbtn.minus { background: var(--danger); justify-self: end; width: 30px; }
.pbtn:disabled { opacity: .3; }
.pbtn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 1px; }
.rt { font: 800 10px var(--body); color: var(--ink-2); } .rt.good { color: var(--ok); }
.tray { flex: 1 1 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; border-top: 2px dashed var(--line); padding-top: 8px; }
.tsum { flex: 1 1 260px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-height: 36px; font-weight: 700; font-size: 13px; }
.tsum .tl { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-2); }
.tsum .arrow { font-size: 20px; }
.tchips { display: inline-flex; gap: 4px; }
.tchip { display: inline-flex; align-items: center; gap: 3px; border-radius: 8px; padding: 2px 7px; font-size: 18px; border: 2px solid rgba(0,0,0,.25); }
.tchip b { font: 400 16px var(--display); color: var(--ink); }
.bankline { flex-basis: 100%; font-size: 12px; color: var(--ink-2); font-weight: 600; } .bankline.ok { color: var(--ok); }
.hintline { color: var(--ink-2); font-weight: 600; }
.tbtns { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }

<script>
/* ============================================================
   Island Settlers — rules engine (headless, deterministic, serializable)
   - All state is plain JSON. The board geometry (s.board) is immutable and is rebuilt
     from the seed and map id, so two copies of the game always get the same board.
   - Everything that changes the game goes through Engine.apply(state, action).
   - Randomness comes from a seeded generator stored in the state (s.rng).
   - Modes: "base" (the classic game) and "seafarers" (ships, islands, gold, pirate).
   ============================================================ */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.CatanEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const RES = ['wood', 'brick', 'sheep', 'wheat', 'ore'];
  const COST = {
    road: { wood: 1, brick: 1 },
    ship: { wood: 1, sheep: 1 },
    settlement: { wood: 1, brick: 1, sheep: 1, wheat: 1 },
    city: { wheat: 2, ore: 3 },
    dev: { sheep: 1, wheat: 1, ore: 1 },
  };
  const DEV_TYPES = ['knight', 'vp', 'roadbuilding', 'yearofplenty', 'monopoly'];
  const DEV_COUNTS = { knight: 14, vp: 5, roadbuilding: 2, yearofplenty: 2, monopoly: 2 };
  const LIMITS = { road: 15, ship: 15, settlement: 5, city: 4 };
  const NUMBERS = [2, 3, 3, 4, 4, 5, 5, 6, 6, 8, 8, 9, 9, 10, 10, 11, 11, 12];
  const PIPS = { 2: 1, 3: 2, 4: 3, 5: 4, 6: 5, 8: 5, 9: 4, 10: 3, 11: 2, 12: 1 };
  const BANK_START = 19;

  /* ---------- seeded RNG ---------- */
  function rnd(s) {
    s.rng = (s.rng + 0x6d2b79f5) >>> 0;
    let t = s.rng;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function rint(s, n) { return Math.floor(rnd(s) * n); }
  function shuffle(s, arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = rint(s, i + 1);
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /* ---------- geometry ---------- */
  const SQ3 = Math.sqrt(3);
  const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
  const BASE_COORDS = (function () {
    const a = [];
    for (let r = -2; r <= 2; r++) for (let q = -2; q <= 2; q++) if (Math.abs(q + r) <= 2) a.push([q, r]);
    return a;
  })();
  function hexDist(a, b) {
    const dq = a.q - b.q, dr = a.r - b.r;
    return Math.max(Math.abs(dq), Math.abs(dr), Math.abs(dq + dr));
  }
  function isLand(h) { return h.terrain !== 'sea'; }
  function isProducing(h) { return RES.indexOf(h.terrain) >= 0; }

  function buildGeometry(defs) {
    const hexes = [], verts = [], edges = [];
    const vmap = new Map(), emap = new Map();
    defs.forEach(function (d, i) {
      const cx = SQ3 * (d.q + d.r / 2), cy = 1.5 * d.r;
      const h = { id: i, q: d.q, r: d.r, x: cx, y: cy, terrain: d.terrain, num: d.num || 0, verts: [], edges: [], nbr: [], island: -1 };
      for (let k = 0; k < 6; k++) {
        const ang = ((60 * k - 30) * Math.PI) / 180;
        const x = cx + Math.cos(ang), y = cy + Math.sin(ang);
        const key = Math.round(x * 1000) + ',' + Math.round(y * 1000);
        let vid = vmap.get(key);
        if (vid === undefined) {
          vid = verts.length; vmap.set(key, vid);
          verts.push({ id: vid, x: x, y: y, hexes: [], adj: [], edges: [], port: null, island: -1 });
        }
        verts[vid].hexes.push(i); h.verts.push(vid);
      }
      hexes.push(h);
    });
    hexes.forEach(function (h) {
      for (let k = 0; k < 6; k++) {
        const a = h.verts[k], b = h.verts[(k + 1) % 6];
        const key = a < b ? a + '-' + b : b + '-' + a;
        let eid = emap.get(key);
        if (eid === undefined) {
          eid = edges.length; emap.set(key, eid);
          edges.push({ id: eid, a: a, b: b, hexes: [], land: 0 });
          verts[a].edges.push(eid); verts[b].edges.push(eid);
          verts[a].adj.push(b); verts[b].adj.push(a);
        }
        edges[eid].hexes.push(h.id); h.edges.push(eid);
      }
    });
    hexes.forEach(function (h) {
      hexes.forEach(function (o) {
        if (o.id !== h.id && hexDist(h, o) === 1) h.nbr.push(o.id);
      });
    });
    edges.forEach(function (e) {
      e.land = e.hexes.filter(function (id) { return isLand(hexes[id]); }).length;
    });
    // islands = connected groups of land hexes
    const islands = [];
    hexes.forEach(function (h) {
      if (!isLand(h) || h.island >= 0) return;
      const id = islands.length, stack = [h.id], members = [];
      h.island = id;
      while (stack.length) {
        const cur = stack.pop(); members.push(cur);
        hexes[cur].nbr.forEach(function (n) {
          if (isLand(hexes[n]) && hexes[n].island < 0) { hexes[n].island = id; stack.push(n); }
        });
      }
      islands.push({ id: id, hexes: members });
    });
    verts.forEach(function (v) {
      v.hexes.forEach(function (hid) { if (hexes[hid].island >= 0) v.island = hexes[hid].island; });
    });
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    verts.forEach(function (v) {
      minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x); minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y);
    });
    return { hexes: hexes, verts: verts, edges: edges, ports: [], islands: islands, bounds: { minX: minX, maxX: maxX, minY: minY, maxY: maxY } };
  }

  /* ---------- ports ---------- */
  function coastRing(board) {
    const coastal = board.edges.filter(function (e) { return e.land === 1; });
    if (!coastal.length) return [];
    const byV = new Map();
    coastal.forEach(function (e) {
      [e.a, e.b].forEach(function (v) {
        if (!byV.has(v)) byV.set(v, []);
        byV.get(v).push(e);
      });
    });
    const ring = [], used = new Set();
    let e = coastal[0], v = e.b;
    used.add(e.id); ring.push(e);
    for (;;) {
      const next = (byV.get(v) || []).find(function (x) { return !used.has(x.id); });
      if (!next) break;
      used.add(next.id); ring.push(next);
      v = next.a === v ? next.b : next.a;
    }
    return ring;
  }
  function addPort(board, e, type) {
    const h = board.hexes[e.hexes.filter(function (x) { return isLand(board.hexes[x]); })[0]];
    const va = board.verts[e.a], vb = board.verts[e.b];
    const mx = (va.x + vb.x) / 2, my = (va.y + vb.y) / 2;
    let dx = mx - h.x, dy = my - h.y;
    const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
    const id = board.ports.length;
    board.ports.push({ id: id, type: type, edge: e.id, verts: [e.a, e.b], x: mx + dx * 0.62, y: my + dy * 0.62, mx: mx, my: my });
    va.port = type; vb.port = type;
  }

  function legalSettlements(s, pid, setup) {
    const out = [];
    for (let i = 0; i < s.board.verts.length; i++) if (settlementOk(s, i, pid, setup)) out.push(i);
    return out;
  }
  function legalRoads(s, pid, setupVertex) {
    const out = [];
    for (let i = 0; i < s.board.edges.length; i++) if (pieceOk(s, i, pid, 'road', setupVertex)) out.push(i);
    return out;
  }
  function legalShips(s, pid, setupVertex) {
    const out = [];
    if (s.mode !== 'seafarers') return out;
    for (let i = 0; i < s.board.edges.length; i++) if (pieceOk(s, i, pid, 'ship', setupVertex)) out.push(i);
    return out;
  }
  function legalCities(s, pid) { return s.players[pid].settlements.slice(); }

  function shipConnectedAt(s, pid, vid, exceptEdge) {
    const o = s.occ[vid];
    if (o && o.pid === pid) return true;
    const v = s.board.verts[vid];
    for (let i = 0; i < v.edges.length; i++) {
      const x = v.edges[i];
      if (x !== exceptEdge && s.roadAt[x] === pid && s.shipAt[x]) return true;
    }
    return false;
  }
  /* A ship may move only if one of its ends touches none of your other pieces. */
  function shipOpen(s, pid, eid) {
    const e = s.board.edges[eid];
    return !shipConnectedAt(s, pid, e.a, eid) || !shipConnectedAt(s, pid, e.b, eid);
  }
  function shipMoveError(s, pid, from, to) {
    if (s.shipAt[from] === undefined || s.roadAt[from] !== pid) return 'Pick one of your ships';
    if (s.shipTurn[from] === s.turn) return 'A ship cannot move on the turn it was built';
    if (!shipOpen(s, pid, from)) return 'That ship is part of a closed route';
    if (onPirateBorder(s, from)) return 'The pirate is blocking that ship';
    if (to === from) return 'Pick a different spot';
    delete s.roadAt[from]; const was = s.shipAt[from]; delete s.shipAt[from];
    const ok = pieceOk(s, to, pid, 'ship');
    s.roadAt[from] = pid; s.shipAt[from] = was;
    return ok ? null : 'A moved ship must still connect to your network';
  }
  function legalShipMoves(s, pid) {
    const out = {};
    if (s.mode !== 'seafarers' || s.shipMoved) return out;
    s.players[pid].ships.forEach(function (from) {
      if (s.shipTurn[from] === s.turn || !shipOpen(s, pid, from) || onPirateBorder(s, from)) return;
      const dests = [];
      delete s.roadAt[from]; const was = s.shipAt[from]; delete s.shipAt[from];
      for (let i = 0; i < s.board.edges.length; i++) if (i !== from && pieceOk(s, i, pid, 'ship')) dests.push(i);
      s.roadAt[from] = pid; s.shipAt[from] = was;
      if (dests.length) out[from] = dests;
    });
    return out;
  }

  function bankRates(s, pid) {
    const rates = { wood: 4, brick: 4, sheep: 4, wheat: 4, ore: 4 };
    const p = s.players[pid];
    p.settlements.concat(p.cities).forEach(function (vid) {
      const port = s.board.verts[vid].port;
      if (!port) return;
      if (port === 'any') RES.forEach(function (r) { if (rates[r] > 3) rates[r] = 3; });
      else rates[port] = 2;
    });
    return rates;
  }

  /* Turns "I want these cards" (and optionally "I would give these") into the cheapest bank
     trade the player's ratios allow. Gives are chosen at the best ratio first. */
  function planBankTrade(s, pid, want, give) {
    const p = s.players[pid], rates = bankRates(s, pid);
    want = want || {}; give = give || {};
    let need = 0;
    RES.forEach(function (r) { need += want[r] || 0; });
    if (need < 1) return { ok: false, error: 'Tap + on the card you want' };
    for (let i = 0; i < RES.length; i++) {
      const r = RES[i];
      if ((want[r] || 0) > 0 && s.bank[r] < want[r]) return { ok: false, error: 'The bank is out of ' + r };
    }
    const explicit = RES.some(function (r) { return (give[r] || 0) > 0; });
    const left = {}, used = {};
    RES.forEach(function (r) {
      used[r] = 0;
      left[r] = (want[r] || 0) > 0 ? 0 : (explicit ? Math.min(give[r] || 0, p.hand[r]) : p.hand[r]);
    });
    for (let k = 0; k < need; k++) {
      let pick = null;
      RES.forEach(function (r) {
        if (left[r] < rates[r]) return;
        if (pick === null || rates[r] < rates[pick] || (rates[r] === rates[pick] && p.hand[r] - used[r] > p.hand[pick] - used[pick])) pick = r;
      });
      if (pick === null) {
        const best = Math.min.apply(null, RES.filter(function (r) { return !((want[r] || 0) > 0); }).map(function (r) { return rates[r]; }));
        return { ok: false, error: explicit ? 'Those cards are not enough. Your best rate is ' + best + ':1' : 'You need ' + best + ' of one resource to trade with the bank' };
      }
      left[pick] -= rates[pick]; used[pick] += rates[pick];
    }
    const g = {}, w = {};
    RES.forEach(function (r) { if (used[r]) g[r] = used[r]; if (want[r]) w[r] = want[r]; });
    return { ok: true, give: g, get: w, units: need };
  }

  function roadLength(s, pid) {
    const p = s.players[pid];
    const own = p.roads.concat(p.ships || []);
    if (!own.length) return 0;
    const at = new Map();
    own.forEach(function (eid) {
      const e = s.board.edges[eid];
      [e.a, e.b].forEach(function (v) { if (!at.has(v)) at.set(v, []); at.get(v).push(eid); });
    });
    let best = 0;
    const used = new Set();
    function dfs(v, len, last) {
      if (len > best) best = len;
      const o = s.occ[v];
      if (len > 0 && o && o.pid !== pid) return;
      const list = at.get(v) || [];
      for (let i = 0; i < list.length; i++) {
        const eid = list[i];
        if (used.has(eid)) continue;
        const type = s.shipAt[eid] ? 1 : 0;
        if (last !== null && type !== last && !(o && o.pid === pid)) continue;
        used.add(eid);
        const e = s.board.edges[eid];
        dfs(e.a === v ? e.b : e.a, len + 1, type);
        used.delete(eid);
      }
    }
    at.forEach(function (_, v) { dfs(v, 0, null); });
    return best;
  }

  function updateAwards(s, ev) {
    const lens = s.players.map(function (p, i) { p.longest = roadLength(s, i); return p.longest; });
    const max = Math.max.apply(null, lens);
    const prev = s.longestRoad.pid;
    let holder = prev;
    if (max < 5) holder = null;
    else if (holder !== null && lens[holder] === max) { /* keeps it on ties */ }
    else {
      const c = [];
      lens.forEach(function (l, i) { if (l === max) c.push(i); });
      holder = c.length === 1 ? c[0] : null;
    }
    s.longestRoad = { pid: holder, len: holder === null ? 0 : lens[holder] };
    if (holder !== prev) {
      if (holder !== null) { say(s, holder, 'takes Longest Road (' + lens[holder] + ')'); ev.push({ t: 'award', kind: 'road', pid: holder }); }
      else if (prev !== null) say(s, prev, 'loses Longest Road');
    }
  }

  function checkWin(s) {
    if (s.phase === 'gameover' || s.phase === 'setup') return;
    if (score(s, s.current, true) >= s.vpToWin) {
      s.phase = 'gameover'; s.winner = s.current; s.pending = null; s.trade = null;
      say(s, s.current, 'wins the game with ' + score(s, s.current, true) + ' points!');
    }
  }

  /* what the game is waiting for (drives bots and the UI prompts) */
  function waiting(s) {
    if (s.phase === 'gameover') return [];
    const pd = s.pending;
    if (pd) {
      if (pd.type === 'discard') return Object.keys(pd.need).map(function (k) { return { pid: +k, need: 'discard', count: pd.need[k] }; });
      if (pd.type === 'gold') return Object.keys(pd.need).map(function (k) { return { pid: +k, need: 'gold', count: Math.min(pd.need[k], bankTotal(s)) }; });
      if (pd.type === 'robber') return [{ pid: s.current, need: 'robber' }];
      if (pd.type === 'steal') return [{ pid: s.current, need: 'steal' }];
      if (pd.type === 'roadbuilding') return [{ pid: s.current, need: 'roadbuilding' }];
    }
    if (s.phase === 'setup') return [{ pid: s.current, need: s.setup.step }];
    const out = [];
    if (s.trade) {
      Object.keys(s.trade.resp).forEach(function (k) { if (s.trade.resp[k] === null) out.push({ pid: +k, need: 'trade_response' }); });
      if (out.length) return out;
    }
    out.push({ pid: s.current, need: s.phase === 'roll' ? 'roll' : 'main' });
    return out;
  }

  function canBuild(s, pid, kind) {
    if (s.phase !== 'main' || s.current !== pid || s.pending) return false;
    const p = s.players[pid];
    if (kind === 'dev') return canPay(p, COST.dev) && s.devDeck.length > 0;
    if (kind === 'ship' && s.mode !== 'seafarers') return false;
    if (!canPay(p, COST[kind])) return false;
    if (kind === 'road') return p.roads.length < LIMITS.road && legalRoads(s, pid).length > 0;
    if (kind === 'ship') return p.ships.length < LIMITS.ship && legalShips(s, pid).length > 0;
    if (kind === 'settlement') return p.settlements.length < LIMITS.settlement && legalSettlements(s, pid, false).length > 0;
    if (kind === 'city') return p.cities.length < LIMITS.city && p.settlements.length > 0;
    return false;
  }
  function canMoveShip(s, pid) {
    return s.mode === 'seafarers' && s.phase === 'main' && s.current === pid && !s.pending && !s.shipMoved && Object.keys(legalShipMoves(s, pid)).length > 0;
  }
  function piecesLeft(s, pid) { const p = s.players[pid]; return (LIMITS.road - p.roads.length) + (s.mode === 'seafarers' ? LIMITS.ship - p.ships.length : 0); }
  function hasFreePiece(s, pid) { return (s.players[pid].roads.length < LIMITS.road && legalRoads(s, pid).length > 0) || (s.players[pid].ships.length < LIMITS.ship && legalShips(s, pid).length > 0); }

  function canPlayDev(s, pid, type) {
    if (s.current !== pid || s.phase === 'setup' || s.phase === 'gameover') return false;
    if (s.pending || s.devPlayed) return false;
    const p = s.players[pid];
    if (type === 'vp' || p.dev[type] < 1) return false;
    if (type === 'roadbuilding') return hasFreePiece(s, pid);
    if (type === 'yearofplenty') return RES.some(function (r) { return s.bank[r] > 0; });
    return true;
  }

  /* ---------- actions ---------- */
  function production(s, roll, ev) {
    const due = {}; // res -> { pid: n }
    const gold = {};
    s.board.hexes.forEach(function (h) {
      if (h.num !== roll || h.id === s.robber) return;
      const isGold = h.terrain === 'gold';
      if (!isProducing(h) && !isGold) return;
      h.verts.forEach(function (vid) {
        const o = s.occ[vid];
        if (!o) return;
        const n = o.city ? 2 : 1;
        if (isGold) { gold[o.pid] = (gold[o.pid] || 0) + n; return; }
        if (!due[h.terrain]) due[h.terrain] = {};
        due[h.terrain][o.pid] = (due[h.terrain][o.pid] || 0) + n;
      });
    });
    const gains = {};
    Object.keys(due).forEach(function (res) {
      const pids = Object.keys(due[res]);
      let total = 0;
      pids.forEach(function (k) { total += due[res][k]; });
      if (s.bank[res] >= total) {
        pids.forEach(function (k) { grant(k, res, due[res][k]); });
      } else if (pids.length === 1) {
        grant(pids[0], res, s.bank[res]);
      } else {
        say(s, null, 'The bank ran short on ' + res + ' — nobody collects it.');
      }
    });
    function grant(k, res, n) {
      if (n <= 0) return;
      s.players[k].hand[res] += n; s.bank[res] -= n;
      if (!gains[k]) gains[k] = emptyHand();
      gains[k][res] += n;
    }
    Object.keys(gains).forEach(function (k) {
      ev.push({ t: 'gain', pid: +k, cards: gains[k], why: 'dice' });
    });
    return { gains: gains, gold: gold };
  }

  function describeCards(c) {
    const parts = [];
    RES.forEach(function (r) { if (c[r]) parts.push(c[r] + ' ' + r); });
    return parts.join(', ');
  }

  function stealFrom(s, thief, victim, ev) {
    const v = s.players[victim], t = s.players[thief];
    const total = handSize(v);
    if (!total) return;
    let k = rint(s, total), res = null;
    for (let i = 0; i < RES.length; i++) {
      if (k < v.hand[RES[i]]) { res = RES[i]; break; }
      k -= v.hand[RES[i]];
    }
    v.hand[res]--; t.hand[res]++;
    say(s, thief, 'steals a card from ' + v.name);
    ev.push({ t: 'steal', from: victim, to: thief, res: res });
  }

  function afterSettle(s, p, vid, ev, setup) {
    if (s.mode !== 'seafarers') return;
    const isl = s.board.verts[vid].island;
    if (isl < 0 || p.islands.indexOf(isl) >= 0) return;
    p.islands.push(isl);
    if (!setup && s.bonus) {
      p.svp += s.bonus;
      say(s, p.id, 'settles a new island (+' + s.bonus + ' points)');
      ev.push({ t: 'island', pid: p.id, pts: s.bonus });
    }
  }

  function apply(s, a) {
    const ev = [];
    function fail(m) { return { ok: false, error: m, events: [] }; }
    function done() {
      if (s.pending && s.pending.type === 'gold' && bankTotal(s) === 0) s.pending = null;
      return { ok: true, events: ev };
    }
    if (!a || typeof a.type !== 'string') return fail('Bad action');
    if (s.phase === 'gameover') return fail('The game is over');
    const pid = a.pid, p = s.players[pid];
    if (!p) return fail('Unknown player');
    const t = a.type;
    const isCur = pid === s.current;

    /* --- allowed for non-current players --- */
    if (t === 'discard') {
      if (!s.pending || s.pending.type !== 'discard' || s.pending.need[pid] === undefined) return fail('Nothing to discard');
      const need = s.pending.need[pid], cards = a.cards || {};
      if (sumCards(cards) !== need) return fail('Discard exactly ' + need + ' cards');
      for (let i = 0; i < RES.length; i++) {
        const n = cards[RES[i]] || 0;
        if (n < 0 || !Number.isInteger(n) || n > p.hand[RES[i]]) return fail('You do not have those cards');
      }
      RES.forEach(function (r) { const n = cards[r] || 0; p.hand[r] -= n; s.bank[r] += n; });
      delete s.pending.need[pid];
      say(s, pid, 'discards ' + need + ' cards');
      if (!Object.keys(s.pending.need).length) s.pending = { type: 'robber', from: 'seven' };
      return done();
    }
    if (t === 'gold_pick') {
      const pd = s.pending;
      if (!pd || pd.type !== 'gold' || pd.need[pid] === undefined) return fail('No gold to collect');
      const cards = a.cards || {}, req = Math.min(pd.need[pid], bankTotal(s));
      let tot = 0;
      for (let i = 0; i < RES.length; i++) {
        const r = RES[i], n = cards[r] || 0;
        if (n < 0 || !Number.isInteger(n)) return fail('Bad choice');
        if (n > s.bank[r]) return fail('The bank is out of ' + r);
        tot += n;
      }
      if (tot !== req) return fail('Pick exactly ' + req + ' card' + (req === 1 ? '' : 's'));
      RES.forEach(function (r) { const n = cards[r] || 0; p.hand[r] += n; s.bank[r] -= n; });
      delete pd.need[pid];
      say(s, pid, 'takes ' + describeCards(cards) + ' from the gold field');
      ev.push({ t: 'gain', pid: pid, cards: cards, why: 'gold' });
      if (!Object.keys(pd.need).length) s.pending = null;
      return done();
    }
    if (t === 'respond_trade') {
      const tr = s.trade;
      if (!tr || tr.resp[pid] !== null || tr.resp[pid] === undefined) return fail('No offer to answer');
      if (a.accept && !canPay(p, tr.get)) return fail('You cannot afford that');
      tr.resp[pid] = !!a.accept;
      return done();
    }
    if (!isCur) return fail('It is not your turn');

    /* any action by the current player other than trade tools cancels an open offer */
    if (t !== 'propose_trade' && t !== 'confirm_trade' && t !== 'cancel_trade' && t !== 'respond_trade') s.trade = null;

    function placePiece(kind, eid, free) {
      const list = kind === 'ship' ? p.ships : p.roads;
      if (list.length >= LIMITS[kind]) return 'You are out of ' + kind + 's';
      if (kind === 'ship' && s.mode !== 'seafarers') return 'There are no ships in this game';
      if (!free && !canPay(p, COST[kind])) return 'You cannot afford a ' + kind;
      if (!pieceOk(s, eid, pid, kind)) return kind === 'ship' && onPirateBorder(s, eid) ? 'The pirate is blocking that spot' : 'You cannot build there';
      if (!free) pay(s, p, COST[kind]);
      s.roadAt[eid] = pid; list.push(eid);
      if (kind === 'ship') { s.shipAt[eid] = true; s.shipTurn[eid] = s.turn; }
      ev.push({ t: 'built', pid: pid, kind: kind, id: eid });
      return null;
    }

    if (s.phase === 'setup') {
      const st = s.setup;
      if (s.pending) return fail('Choose your gold first');
      if (t === 'place_settlement') {
        if (st.step !== 'settlement') return fail('Place a road now');
        if (!settlementOk(s, a.vertex, pid, true)) return fail(s.home && s.board.verts[a.vertex] && s.home.indexOf(s.board.verts[a.vertex].island) < 0 && !s.occ[a.vertex] ? 'Start on the home island' : 'You cannot build there');
        s.occ[a.vertex] = { pid: pid, city: false };
        p.settlements.push(a.vertex);
        say(s, pid, 'places a settlement');
        ev.push({ t: 'built', pid: pid, kind: 'settlement', id: a.vertex });
        afterSettle(s, p, a.vertex, ev, true);
        if (st.idx >= s.players.length) {
          const got = emptyHand();
          let gold = 0;
          s.board.verts[a.vertex].hexes.forEach(function (hid) {
            const h = s.board.hexes[hid];
            if (isProducing(h) && s.bank[h.terrain] > 0) { p.hand[h.terrain]++; s.bank[h.terrain]--; got[h.terrain]++; }
            else if (h.terrain === 'gold') gold++;
          });
          if (sumCards(got)) { say(s, pid, 'collects ' + describeCards(got)); ev.push({ t: 'gain', pid: pid, cards: got, why: 'setup' }); }
          if (gold && bankTotal(s) > 0) { const need = {}; need[pid] = gold; s.pending = { type: 'gold', need: need }; }
        }
        st.step = 'road'; st.last = a.vertex;
        return done();
      }
      if (t === 'place_road' || t === 'place_ship') {
        if (st.step !== 'road') return fail('Place a settlement first');
        const kind = t === 'place_ship' ? 'ship' : 'road';
        if (!pieceOk(s, a.edge, pid, kind, st.last)) return fail('It must touch your new settlement');
        s.roadAt[a.edge] = pid; (kind === 'ship' ? p.ships : p.roads).push(a.edge);
        if (kind === 'ship') { s.shipAt[a.edge] = true; s.shipTurn[a.edge] = 0; }
        ev.push({ t: 'built', pid: pid, kind: kind, id: a.edge });
        st.idx++; st.step = 'settlement'; st.last = null;
        if (st.idx >= st.order.length) {
          s.phase = 'roll'; s.current = st.order[0]; s.turn = 1;
          updateAwards(s, ev);
          say(s, s.current, 'goes first. Roll the dice!');
        } else s.current = st.order[st.idx];
        return done();
      }
      return fail('Finish setup first');
    }

    /* --- pending sub-steps --- */
    if (s.pending) {
      const pd = s.pending;
      if (pd.type === 'robber' && (t === 'move_robber' || t === 'move_pirate')) {
        const h = s.board.hexes[a.hex];
        let victims = [];
        if (t === 'move_robber') {
          if (!h || !isLand(h) || a.hex === s.robber) return fail('Pick a different hex');
          s.robber = a.hex;
          ev.push({ t: 'robber', hex: a.hex });
          h.verts.forEach(function (vid) {
            const o = s.occ[vid];
            if (o && o.pid !== pid && victims.indexOf(o.pid) < 0 && handSize(s.players[o.pid]) > 0) victims.push(o.pid);
          });
          say(s, pid, 'moves the robber');
        } else {
          if (s.mode !== 'seafarers') return fail('There is no pirate in this game');
          if (!h || isLand(h) || a.hex === s.pirate) return fail('Pick a different sea hex');
          s.pirate = a.hex;
          ev.push({ t: 'pirate', hex: a.hex });
          h.edges.forEach(function (eid) {
            const o = s.roadAt[eid];
            if (o !== undefined && s.shipAt[eid] && o !== pid && victims.indexOf(o) < 0 && handSize(s.players[o]) > 0) victims.push(o);
          });
          say(s, pid, 'moves the pirate');
        }
        if (!victims.length) s.pending = null;
        else if (victims.length === 1) { stealFrom(s, pid, victims[0], ev); s.pending = null; }
        else s.pending = { type: 'steal', hex: a.hex, victims: victims };
        return done();
      }
      if (pd.type === 'steal' && t === 'steal') {
        if (pd.victims.indexOf(a.victim) < 0) return fail('Pick one of the highlighted players');
        stealFrom(s, pid, a.victim, ev);
        s.pending = null;
        return done();
      }
      if (pd.type === 'roadbuilding' && (t === 'place_road' || t === 'place_ship')) {
        const err = placePiece(t === 'place_ship' ? 'ship' : 'road', a.edge, true);
        if (err) return fail(err);
        say(s, pid, t === 'place_ship' ? 'builds a free ship' : 'builds a free road');
        pd.left--;
        updateAwards(s, ev);
        if (pd.left <= 0 || !hasFreePiece(s, pid)) s.pending = null;
        checkWin(s);
        return done();
      }
      if (pd.type === 'roadbuilding' && t === 'skip_roads') { s.pending = null; return done(); }
      return fail('Finish the current step first');
    }

    /* --- turn actions --- */
    switch (t) {
      case 'roll': {
        if (s.phase !== 'roll') return fail('You already rolled');
        let d1, d2;
        if (a.dice && s.allowDice) { d1 = a.dice[0]; d2 = a.dice[1]; } else { d1 = 1 + rint(s, 6); d2 = 1 + rint(s, 6); }
        const sum = d1 + d2;
        s.dice = [d1, d2]; s.lastRoll = [d1, d2]; s.phase = 'main';
        say(s, pid, 'rolls ' + sum);
        ev.push({ t: 'roll', pid: pid, dice: [d1, d2], sum: sum });
        if (sum === 7) {
          const need = {};
          s.players.forEach(function (q, i) { const n = handSize(q); if (n > 7) need[i] = Math.floor(n / 2); });
          s.pending = Object.keys(need).length ? { type: 'discard', need: need } : { type: 'robber', from: 'seven' };
        } else {
          const r = production(s, sum, ev);

  /* ---------- hand, +/- trade draft, actions ---------- */

  function draftParts() {

      let g = MP.lobby.guests.find(function (x) { return x.cid === m.cid; });
      if (!g) {
        if (MP.lobby.guests.length >= 3) { MP.net.res(m.cid, 'hello', false, 'That room is full'); return; }
        g = { cid: m.cid, name: m.name || 'Player ' + (MP.lobby.guests.length + 2) };
        MP.lobby.guests.push(g);
      } else if (m.name) g.name = m.name;
      MP.net.res(m.cid, 'hello', true, '');
      renderModal();
      return;
    }
    if (MP.seats.indexOf(m.cid) >= 1) { MP.net.res(m.cid, 'hello', true, ''); MP.net.resendInit(); pushState(); return; }
    // someone who arrives just after Start can still take a bot's seat until the first roll
    const slot = S.phase === 'setup' ? S.players.findIndex(function (q, ix) { return ix > 0 && q.isBot && MP.seats[ix] === null; }) : -1;
    if (slot > 0) {
      const q = S.players[slot];
      q.isBot = false; q.name = m.name || q.name; MP.seats[slot] = m.cid;
      MP.init.players[slot] = { name: q.name, color: q.color }; MP.init.seats = MP.seats;
      mpPersist();
      MP.net.res(m.cid, 'hello', true, '');
      MP.net.sendInit(MP.init);
      toast(q.name + ' joined and took a bot seat');
      renderAll(); schedule();
    } else MP.net.res(m.cid, 'hello', false, 'That game has already started');
  }
  function hostAction(m) {
    if (!MP || MP.role !== 'host' || !MP.started || !S) return;
    if (MP.seen.has(m.aid)) return;
    MP.seen.add(m.aid);
    const seat = MP.seats.indexOf(m.cid);
    if (seat < 1 || !S.players[seat] || S.players[seat].isBot) return;
    const a = Object.assign({}, m.action, { pid: seat });
    const r = E.apply(S, a);
    if (!r.ok) { MP.net.res(m.cid, m.aid, false, r.error); return; }
    handleEvents(r.events);
    ui.thinking = null;
    renderAll();
    schedule();
  }
  function startHostGame() {
    if (!MP || MP.role !== 'host' || MP.started) return;
    const guests = MP.lobby.guests, humans = 1 + guests.length, bots = Math.min(settings.mpBots, 4 - humans);
    if (humans + bots < 2) { toast('Add a friend or a bot first', true); return; }
    const taken = [settings.color], players = [{ name: settings.name.trim() || 'Host', color: settings.color }], seats = [MP.cid];
    guests.forEach(function (g) {
      const col = [0, 1, 2, 3].find(function (c) { return taken.indexOf(c) < 0; });
      taken.push(col); players.push({ name: g.name || 'Player', color: col }); seats.push(g.cid);
    });
    botDefs(bots, taken).forEach(function (b) { players.push(b); seats.push(null); });
    launchHost(Object.assign(gameOpts(), { players: players }), seats);
  }
  function launchHost(opts, seats) {
    clearTimeout(timer);
    const g = E.newGame(opts);
    MP.started = true; MP.seats = seats;
    MP.init = { mode: g.mode, map: g.mapId, seed: g.seed, vpToWin: g.vpToWin, players: opts.players, seats: seats };
    ME = 0;
    S = g; board = S.board; resetUi();
    buildBoard();
    mpPersist();
    MP.net.sendInit(MP.init);
    renderAll();
    schedule();
  }
  function rematch() {
    if (!MP || MP.role !== 'host' || !MP.started) return;
    const players = S.players.map(function (p) { return { name: p.name, color: p.color, isBot: p.isBot, diff: p.diff }; });
    launchHost(Object.assign(gameOpts(), { players: players }), MP.seats.slice());
  }
  function resumeHost(saved) {
    MP = { role: 'host', code: saved.code, cid: saved.cid, started: true, lobby: { guests: [] }, seen: new Set(), seats: saved.seats, init: saved.init, net: null, room: null };
    const my = MP;
    (async function () {
      let room = await openRoom(saved.code, 'host');
      for (let i = 0; i < 4 && !room && lastRoomErr === 'unavailable-id' && MP === my; i++) { await new Promise(function (r) { setTimeout(r, 4000); }); room = await openRoom(saved.code, 'host'); }
      if (MP !== my) return;
      if (!room) { toast('Could not reopen the room. Playing on your own for now.', true); MP = null; renderAll(); schedule(); return; }
      my.room = room;
      my.net = NET.connect(room, { role: 'host', cid: my.cid, onHello: hostHello, onAction: hostAction, onError: function () { /* transient */ } });
      my.net.keepAlive(4000);
      my.net.sendInit(my.init);
      renderAll(); schedule();
    })();
  }

  async function joinRoom(text) {
    const code = NET.normalizeCode(text);
    if (code.length < 4) { toast('Enter the room code first', true); return; }
    if (MP) return;
    let cid = newCid();
    try { const sv = JSON.parse(localStorage.getItem('is-room') || 'null'); if (sv && sv.code === code && sv.cid) cid = sv.cid; } catch (e) { /* ignore */ }
    MP = { role: 'guest', code: code, cid: cid, started: false, status: 'Connecting…', net: null, room: null, stale: false, lastRx: Date.now() };
    clearTimeout(timer);
    ui.modal = 'lobby'; renderModal();
    const my = MP;
    const room = await openRoom(code, 'guest');
    if (MP !== my) return;
    if (!room) { const msg = roomFailMsg('guest'); MP = null; ui.modal = 'menu'; renderAll(); toast(msg, true); schedule(); return; }
    my.room = room;
    my.net = NET.connect(room, { role: 'guest', cid: cid, onInit: guestInit, onState: guestState, onRes: guestRes, onError: function (e) {
      if (MP === my && e && e.code === 'not_permitted' && !my.err) { my.err = 'denied'; renderModal(); }
    } });
    const hello = function () { if (MP === my && !my.started) { my.net.hello(settings.name.trim() || 'Player'); } };
    hello(); my.helloTimer = setInterval(hello, 2000);
    my.staleTimer = setInterval(function () {
      if (MP !== my || !my.started) return;
      const st = Date.now() - my.lastRx > 14000;
      if (st !== my.stale) { my.stale = st; renderCaption(); }
      if (st) my.net.hello(settings.name.trim() || 'Player');
    }, 3000);
    my.status = 'Looking for the host…'; renderModal();
    my.slowTimer = setTimeout(function () { if (MP === my && !my.joined) { my.slow = true; renderModal(); } }, 8000);
    mpPersist();
  }
  function guestInit(obj) {
    if (!MP || MP.role !== 'guest') return;
    const seat = (obj.seats || []).indexOf(MP.cid);
    if (seat < 0) { toast('You are not in this game', true); leaveRoom(); return; }
    clearTimeout(timer);
    MP.started = true; MP.lastRx = Date.now(); MP.stale = false;
    ME = seat;
    S = E.newGame(obj); board = S.board;
    resetUi();
    buildBoard();
    renderAll();
  }
  function guestState(snap) {
    if (!MP || MP.role !== 'guest' || !MP.started || !S) return;
    MP.lastRx = Date.now(); MP.stale = false;
    E.restore(S, snap);
    if (ME >= 0 && S.current !== ME) { ui.mode = null; ui.shipFrom = null; }
    renderAll();
  }
  function guestRes(d) {
    if (!MP || MP.role !== 'guest') return;
    if (d.aid === 'hello') {
      if (!d.ok) { const msg = d.error || 'Could not join'; leaveRoom(); toast(msg, true); }
      else { MP.lastRx = Date.now(); if (!MP.joined) { MP.joined = true; MP.err = ''; MP.status = 'You are in! Waiting for the host to start…'; renderModal(); } }
      return;
    }
    if (!d.ok && d.error) toast(d.error, true);
  }
  function guestSend(action) {
    const net = MP.net;
    if (!net) { toast('Not connected yet', true); return; }
    const aid = net.act(action);
    [1000, 2200, 4000].forEach(function (ms) { setTimeout(function () { if (MP && MP.net === net) net.resend(aid, action); }, ms); });
  }
  function leaveRoom() {
    const my = MP;
    if (my) {
      clearInterval(my.helloTimer); clearInterval(my.staleTimer); clearTimeout(my.slowTimer);
      try { if (my.net) my.net.close(); } catch (e) { /* ignore */ }
      try { if (my.room && my.room.leave) my.room.leave(); } catch (e) { /* ignore */ }
    }
    MP = null; mpForget();
    try { localStorage.removeItem('is-room'); } catch (e) { /* ignore */ }
    ME = 0;
    newGame();
    clearTimeout(timer); ui.modal = 'menu'; renderModal();
  }

  /* ---------- input ---------- */
  function onBoardClick(e) {
    if (ui.noClick) return;
    const t = e.target.closest('[data-v],[data-e],[data-h]');
    if (!t || S.current !== ME) return;
    if (t.dataset.h !== undefined) {
      const id = +t.dataset.h;
      return void dispatch({ type: E.isLand(board.hexes[id]) ? 'move_robber' : 'move_pirate', hex: id });
    }
    if (t.dataset.v !== undefined) {
      const v = +t.dataset.v;
      if (S.phase === 'setup' || ui.mode === 'settlement') return void dispatch({ type: 'place_settlement', vertex: v });
      if (ui.mode === 'city') return void dispatch({ type: 'build_city', vertex: v });
    }
    if (t.dataset.e !== undefined) {
      const id = +t.dataset.e;
      if (ui.mode === 'moveship' && !S.pending) {
        if (t.classList.contains('src')) { ui.shipFrom = ui.shipFrom === id ? null : id; renderPrompt(); renderDyn(); return; }
        return void dispatch({ type: 'move_ship', from: ui.shipFrom, to: id });
      }
      dispatch({ type: t.classList.contains('ship') ? 'place_ship' : 'place_road', edge: id });
    }
  }
  function toggleBuild(kind) {
    if (!E.canBuild(S, ME, kind)) { toast(reasonCant(kind), true); return; }
    ui.mode = ui.mode === kind ? null : kind; ui.shipFrom = null;
    renderActions(); renderDyn(); renderPrompt();
  }
  function toggleMove() {
    if (!E.canMoveShip(S, ME)) { toast(S.shipMoved ? 'You already moved a ship this turn' : 'No ship can move right now', true); return; }
    ui.mode = ui.mode === 'moveship' ? null : 'moveship'; ui.shipFrom = null;
    renderActions(); renderDyn(); renderPrompt();
  }
  function endTurn() {
    if (S.current === ME && S.phase === 'main' && !S.pending) { ui.mode = null; ui.shipFrom = null; ui.modal = null; ui.draft = {}; dispatch({ type: 'end_turn' }); }
  }
  function autoDiscard(n) {
    const p = S.players[ME], hand = {}; RES.forEach(function (r) { hand[r] = p.hand[r]; });
    const out = {};
    for (let i = 0; i < n; i++) {
      let pick = null;
      RES.forEach(function (r) { if (hand[r] > 0 && (pick === null || hand[r] > hand[pick])) pick = r; });
      hand[pick]--; out[pick] = (out[pick] || 0) + 1;
    }
    return out;
  }
  function closeModal() {
    ui.plenty = [];
    ui.modal = MP && !MP.started ? 'lobby' : (ui.back || null); ui.back = null;
    renderModal(); schedule();
  }
  function doTrade(kind) {
    const parts = draftParts();
    if (kind === 'players') {
      if (dispatch({ type: 'propose_trade', give: parts.give, get: parts.want })) { lastModal = ''; renderModal(); }
      return;
    }
    const plan = E.planBankTrade(S, ME, parts.want, parts.give);
    if (!plan.ok) { toast(plan.error, true); return; }
    if (dispatch({ type: 'bank_trade', give: plan.give, get: plan.get })) {
      ui.draft = {};
      toast('Traded ' + cardsText(plan.give) + ' for ' + cardsText(plan.get));
      renderHand(); renderTray();
    }
  }

  function onClick(e) {
    const zb = e.target.closest('[data-zoom]');
    if (zb) { const z = zb.dataset.zoom; if (z === 'reset') { view.k = 1; view.x = view.bx; view.y = view.by; applyView(); } else zoomCenter(z === 'in' ? 1.4 : 1 / 1.4); return; }
    const link = e.target.closest('a[data-settings-open]');
    if (link) { e.preventDefault(); ui.modal = 'settings'; renderModal(); return; }
    const t = e.target.closest('button,[data-close]');
    if (!t || t.disabled) return;
    const d = t.dataset;
    if (d.do === 'roll') return void dispatch({ type: 'roll' });
    if (d.do === 'end') return void endTurn();
    if (d.do === 'dev') return void dispatch({ type: 'buy_dev' });
    if (d.do === 'moveship') return void toggleMove();
    if (d.do === 'skiproads') return void dispatch({ type: 'skip_roads' });
    if (d.build) return void toggleBuild(d.build);
    if (d.kind) { ui.kind = d.kind; renderActions(); renderDyn(); return; }
    if (d.adj) { const q = d.adj.split(':'); return void adjust(q[0], +q[1]); }
    if (d.pickclear !== undefined) { const pm = pickMode(); if (pm) { if (pm.kind === 'discard') ui.discard = {}; else ui.gold = {}; renderHand(); renderTray(); } return; }
    if (d.draftClear !== undefined) { ui.draft = {}; renderHand(); renderTray(); return; }
    if (d.trade) return void doTrade(d.trade);
    if (d.play) {
      ui.mode = null;
      if (d.play === 'knight') return void dispatch({ type: 'play_knight' });
      if (d.play === 'roadbuilding') return void dispatch({ type: 'play_roadbuilding' });
      if (d.play === 'yearofplenty') { ui.modal = 'plenty'; ui.plenty = []; renderModal(); return; }
      if (d.play === 'monopoly') { ui.modal = 'monopoly'; renderModal(); return; }
    }
    if (t.id === 'btnSettings') { ui.modal = 'settings'; if (!MP) clearTimeout(timer); renderModal(); return; }
    if (t.id === 'btnHelp') { ui.modal = 'help'; renderModal(); return; }
    if (t.id === 'btnMenu' || d.menu !== undefined) { ui.modal = 'menu'; ui.back = null; if (!MP) clearTimeout(timer); renderModal(); return; }
    if (d.resume !== undefined) { ui.modal = null; renderModal(); schedule(); return; }
    if (d.helpOpen !== undefined) { ui.back = 'menu'; ui.modal = 'help'; renderModal(); return; }
    if (d.close !== undefined) return void closeModal();
    if (d.settingsOpen !== undefined) { if (ui.modal === 'menu') ui.back = 'menu'; ui.modal = 'settings'; renderModal(); return; }
    if (d.newgame !== undefined) { ui.modal = null; newGame(); return; }
    if (d.set) {
      const v = d.val;
      if (d.set === 'mode') { settings.mode = v; settings.map = ''; }
      else settings[d.set] = ['bots', 'vp', 'color', 'mpBots'].indexOf(d.set) >= 0 ? +v : v;
      saveSettings();
      if (d.set === 'diff' && S && v !== 'mixed') S.players.forEach(function (p) { if (p.isBot) p.diff = v; });
      lastModal = ''; renderModal(); renderPlayers(); return;
    }
    if (d.map) { settings.map = d.map; saveSettings(); lastModal = ''; renderModal(); return; }
    if (d.toggle) { settings[d.toggle] = !settings[d.toggle]; saveSettings(); lastModal = ''; renderModal(); renderDyn(); return; }
    if (d.step) {
      const parts = d.step.split(':'), side = parts[0], r = parts[1], dl = +parts[2];
      const o = side === 'k' ? ui.gold : ui.discard;
      o[r] = Math.max(0, (o[r] || 0) + dl);
      lastModal = ''; renderModal(); return;
    }
    if (d.confirm) { if (dispatch({ type: 'confirm_trade', with: +d.confirm })) { ui.draft = {}; toast('Trade done'); lastModal = ''; renderModal(); } return; }
    if (d.cancelOffer !== undefined) { dispatch({ type: 'cancel_trade' }); lastModal = ''; renderModal(); return; }
    if (d.resp !== undefined) return void dispatch({ type: 'respond_trade', accept: d.resp === '1' });
    if (d.steal) return void dispatch({ type: 'steal', victim: +d.steal });
    if (d.autodiscard !== undefined) { ui.discard = autoDiscard(pendingDiscardNeed()); renderHand(); renderTray(); return; }
    if (d.dodiscard !== undefined) { const c = ui.discard; ui.discard = {}; return void dispatch({ type: 'discard', cards: c }); }
    if (d.dogold !== undefined) { const c = ui.gold; ui.gold = {}; return void dispatch({ type: 'gold_pick', cards: c }); }
    if (d.plenty) { if (ui.plenty.length < 2) ui.plenty.push(d.plenty); lastModal = ''; renderModal(); return; }
    if (d.plentyClear !== undefined) { ui.plenty = []; lastModal = ''; renderModal(); return; }
    if (d.plentyGo !== undefined) { const a = ui.plenty; ui.plenty = []; ui.modal = null; return void dispatch({ type: 'play_yearofplenty', a: a[0], b: a[1] }); }
    if (d.mono) { ui.modal = null; return void dispatch({ type: 'play_monopoly', res: d.mono }); }
    /* rooms */
    if (d.host !== undefined) return void hostRoom();
    if (d.join !== undefined) return void joinRoom(ui.joinCode);
    if (d.start !== undefined) return void startHostGame();
    if (d.leave !== undefined) return void leaveRoom();
    if (d.lobbyCancel !== undefined) return void leaveRoom();
    if (d.copy !== undefined) {
      try { navigator.clipboard.writeText(MP.code).then(function () { toast('Code copied'); }, function () { toast('Room code: ' + MP.code); }); } catch (err) { toast('Room code: ' + MP.code); }
      return;
    }
    if (d.botify) {
      const i = +d.botify, p = S.players[i];
      if (MP && MP.role === 'host' && p && !p.isBot) { p.isBot = true; p.diff = settings.diff === 'mixed' ? 'medium' : settings.diff; MP.seats[i] = null; mpPersist(); lastModal = ''; renderAll(); schedule(); }
      return;
    }
  }
  function onInput(e) {
    const f = e.target && e.target.dataset && e.target.dataset.field;
    if (!f) return;
    if (f === 'joinCode') { ui.joinCode = NET.normalizeCode(e.target.value); return; }
    if (f === 'seed') { settings.seed = e.target.value.replace(/[^0-9]/g, ''); saveSettings(); return; }
    if (f === 'name') { settings.name = e.target.value.slice(0, 14); saveSettings(); }
  }
  function onKey(e) {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) {
      if (e.key === 'Enter' && e.target.dataset.field === 'joinCode') joinRoom(ui.joinCode);
      return;
    }
    if (e.key === 'Escape') {
      ui.mode = null; ui.shipFrom = null;
      if (ui.modal && !(S.pending && S.current === ME)) closeModal(); else if (!ui.modal) { ui.draft = {}; }
      renderActions(); renderDyn(); renderHand(); renderTray(); renderPrompt(); return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey || !S || S.phase === 'gameover' || ui.modal) return;
    const k = e.key.toLowerCase();
    if (e.key === '?') { ui.modal = 'help'; renderModal(); return; }
    if (S.current !== ME) return;
    if (k === ' ' || k === 'enter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      e.preventDefault();
      if (S.phase === 'roll' && !S.pending) dispatch({ type: 'roll' }); else endTurn();
    } else if (S.phase === 'main' && !S.pending) {
      if (k === 'r') toggleBuild('road'); else if (k === 's') toggleBuild('settlement'); else if (k === 'c') toggleBuild('city');
      else if (k === 'b' && sea()) toggleBuild('ship'); else if (k === 'm' && sea()) toggleMove();
      else if (k === 'd') { if (E.canBuild(S, ME, 'dev')) dispatch({ type: 'buy_dev' }); else toast(reasonCant('dev'), true); }
    }
  }

  /* ---------- boot ---------- */
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('keydown', onKey);
  $('#board').addEventListener('click', onBoardClick);
  initZoom();
  window.IslandSettlers = { get state() { return S; }, get mp() { return MP; }, get me() { return ME; }, newGame: newGame, settings: settings, dispatch: dispatch, ui: ui, render: renderAll, hostRoom: hostRoom, joinRoom: joinRoom };

  const saved = loadGame();
  let savedMp = null;
  try { savedMp = JSON.parse(localStorage.getItem('is-mp') || 'null'); } catch (e) { savedMp = null; }
  try { const rr = JSON.parse(localStorage.getItem('is-room') || 'null'); if (rr && rr.code) ui.joinCode = rr.code; } catch (e) { /* ignore */ }
  if (saved) {
    S = saved; board = S.board; ui.known = new Set();
    // pieces already on the board should not animate in after a reload
    Object.keys(S.roadAt).forEach(function (e) { ui.known.add(S.shipAt[e] ? 's' + e : 'r' + e); });
    Object.keys(S.occ).forEach(function (v) { ui.known.add('b' + (S.occ[v].city ? 'c' : 's') + v); });
    buildBoard(); renderAll(); schedule();
    if (savedMp && savedMp.role === 'host' && savedMp.init) resumeHost(savedMp);
  } else newGame();
  clearTimeout(timer); ui.modal = 'menu'; renderModal();
})();

</script>
